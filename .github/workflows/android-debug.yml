name: Android debug APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - export_presets.cfg
      - .github/workflows/android-debug.yml

jobs:
  export:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Install Godot 4.3 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q templates.tpz -d templates
          cp -a templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
      - name: Configure ephemeral debug signing
        shell: bash
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Android Debug,O=CI,C=US"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Import and export debug APK
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --editor --import
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          godot --headless --verbose --path . --export-debug "Android Debug" build/tinyrush-debug.apk
          test "$(stat -c %s build/tinyrush-debug.apk)" -gt 1048576
      - name: Verify APK identity
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging build/tinyrush-debug.apk | tee build/apk-badging.txt
          grep -q "package: name='com.zweeback.tinyrush'" build/apk-badging.txt
          grep -q "versionName='0.5.1'" build/apk-badging.txt
          sha256sum build/tinyrush-debug.apk | tee build/apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tinyrush-android-debug
          path: |
            build/tinyrush-debug.apk
            build/apk-badging.txt
            build/apk-sha256.txt
          retention-days: 14
